spring:
  application:
    name: sistema-estoque

  datasource:
    url: ${DB_URL:jdbc:h2:mem:estoque}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

logging:
  level:
    com.estoque: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG